name: Keep Qdrant and Redis alive

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install qdrant-client redis

      - name: Ping Qdrant
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python scripts/keepalive/ping_qdrant.py

      - name: Ping Redis
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python scripts/keepalive/ping_redis.py